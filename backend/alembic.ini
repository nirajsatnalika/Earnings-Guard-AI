# A generic, single database configuration.

[alembic]
# path to migration scripts, relative to alembic.ini location
script_location = alembic

# Version locations
version_locations = %(script_location)s/versions

# Database URL is loaded from the DATABASE_URL environment variable in env.py.
# Do NOT set sqlalchemy.url here — it would expose credentials if committed.
# sqlalchemy.url is intentionally left unset.

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
